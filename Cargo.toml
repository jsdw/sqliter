[package]
name = "sqliter"
version = "0.7.0"
edition = "2024"
rust-version = "1.89"
authors = ["james@jsdw.me"]
description = "An opinionated async connnection/migration handler for rusqlite to make light work of using sqlite databases for small apps"
license = "MIT"
repository = "https://github.com/jsdw/sqliter"
documentation = "https://docs.rs/sqliter"
readme = "README.md"

[dependencies]
async-rusqlite = "0.6.0"
# Must match the rusqlite version used by async-rusqlite (only one bundled
# libsqlite3-sys can be linked); we depend on it directly to enable "bundled".
rusqlite = { version = "0.41.0", features = ["bundled"] }
thiserror = "2.0.21"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
tempfile = "3.27.0"
